name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update buildozer.spec
        run: |
          sed -i 's/^requirements = .*/requirements = hostpython3==3.10.11, python3==3.10.11, kivy==2.3.0, requests, feedparser==6.0.11, certifi/' buildozer.spec
          
          if grep -q '^android.ndk' buildozer.spec; then
            sed -i 's/^android.ndk = .*/android.ndk = 25c/' buildozer.spec
          else
            echo "android.ndk = 25c" >> buildozer.spec
          fi
          
          if grep -q '^android.p4a_args' buildozer.spec; then
            sed -i 's/^android.p4a_args = .*/android.p4a_args = --no-upgrade-pip --no-ensurepip --pip-args="--no-cache-dir --disable-pip-version-check --force-reinstall --no-deps"/' buildozer.spec
          else
            echo 'android.p4a_args = --no-upgrade-pip --no-ensurepip --pip-args="--no-cache-dir --disable-pip-version-check --force-reinstall --no-deps"' >> buildozer.spec
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            \~/.cache/pip
            \~/.buildozer
            .buildozer
            \~/.gradle
            \~/.android
          key: \( {{ runner.os }}-buildozer- \){{ hashFiles('buildozer.spec') }}-v20
          restore-keys: Linux-buildozer-

      - name: Clean previous build
        run: python -m buildozer android clean || true

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip python3-venv \
            build-essential libffi-dev libssl-dev autoconf automake libtool \
            pkg-config zlib1g-dev libltdl-dev

      - name: Install buildozer + Cython
        run: |
          pip install --no-cache-dir git+https://github.com/kivy/buildozer.git
          pip install --no-cache-dir cython==0.29.36

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        env:
          CFLAGS: "-Wno-error=implicit-function-declaration"
          PIP_NO_CACHE_DIR: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m buildozer android debug

      - name: List and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-apk
          path: |
            bin/*.apk
            .buildozer/android/platform/build-*/outputs/apk/debug/*.apk
          if-no-files-found: warn
