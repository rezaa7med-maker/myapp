name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            \~/.cache/pip
            \~/.buildozer
            .buildozer
            \~/.gradle
            \~/.android
          key: ${{ runner.os }}-buildozer-arm64-v24
          restore-keys: Linux-buildozer-

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip build-essential libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev libltdl-dev

      - name: Install Buildozer & Cython
        run: |
          pip install --no-cache-dir git+https://github.com/kivy/buildozer.git
          pip install --no-cache-dir cython==0.29.36 pip==23.3.2

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Clean old build
        run: python -m buildozer android clean || true

      - name: Build APK (arm64 only)
        env:
          CFLAGS: "-Wno-error=implicit-function-declaration"
          PIP_NO_CACHE_DIR: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-apk
          path: bin/*.apk
          if-no-files-found: warn
