name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update buildozer.spec with stable configuration
        run: |
          sed -i 's/^requirements = .*/requirements = hostpython3==3.10.11, python3==3.10.11, kivy==2.3.0, requests, feedparser==6.0.11, certifi/' buildozer.spec
          if grep -q '^android.ndk' buildozer.spec; then
            sed -i 's/^android.ndk = .*/android.ndk = 25c/' buildozer.spec
          else
            echo "android.ndk = 25c" >> buildozer.spec
          fi
          # افزودن --no-upgrade-pip به android.p4a_args
          if grep -q '^android.p4a_args' buildozer.spec; then
            sed -i 's/^android.p4a_args = .*/android.p4a_args = --no-upgrade-pip/' buildozer.spec
          else
            echo "android.p4a_args = --no-upgrade-pip" >> buildozer.spec
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.buildozer
            .buildozer
            ~/.gradle
            ~/.android
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}-v10
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Full clean of previous builds
        run: |
          python -m buildozer android clean || true

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            libffi-dev libssl-dev \
            build-essential \
            autoconf automake libtool pkg-config \
            zlib1g-dev libltdl-dev

      - name: Install buildozer and cython
        run: |
          python -m pip install --upgrade pip==23.0
          python -m pip --version
          pip install --upgrade git+https://github.com/kivy/buildozer.git
          pip install cython==0.29.36

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Build APK
        env:
          CFLAGS: "-Wno-error=implicit-function-declaration"
        run: python -m buildozer android debug

      - name: List APK outputs
        run: |
          echo "Listing bin directory:"
          ls -la bin || true
          echo "Searching for apk:"
          find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            bin/*.apk
            .buildozer/android/platform/build-*/outputs/apk/debug/*.apk
          if-no-files-found: error
